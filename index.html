let games = GAMES_FALLBACK;
const normalize = data => data.map(g => ({...g, thumbnail:(g.thumbnail||'').split('/').pop()}));
function renderGames(platform='android'){
  const list=games.filter(g=>platform==='android'?g.link_android:g.link_ios);
  document.querySelector('#store-grid').innerHTML=list.map(g=>`<article class="store-card reveal in"><img src="logothumbnail/${g.thumbnail}" alt="${g.name}" loading="lazy"><div><small>QuangDM · Mobile Game</small><h3>${g.name}</h3><a href="${platform==='android'?g.link_android:g.link_ios}" target="_blank" rel="noopener">${platform==='android'?'Google Play':'App Store'} ↗</a></div></article>`).join('');
  document.querySelector('#store-count').textContent=`${games.length} sản phẩm · ${list.length} trên ${platform==='android'?'Android':'iOS'}`;
}
fetch('games_store.json').then(r=>r.ok?r.json():Promise.reject()).then(d=>{games=normalize(d);renderGames()}).catch(()=>renderGames());
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderGames(b.dataset.platform)}));
