<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#FF7A1A" stroke-opacity=".13"/>
      <circle cx="0" cy="0" r="2" fill="#FFB066" fill-opacity=".28"/>
    </pattern>
    <radialGradient id="fade">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="mask"><rect width="800" height="800" fill="url(#fade)"/></mask>
  </defs>
  <rect width="800" height="800" fill="url(#grid)" mask="url(#mask)"/>
</svg>
